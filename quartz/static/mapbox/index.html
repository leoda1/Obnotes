<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // NOTE: Use a PUBLIC token (pk.*) in browser code.
      // Replace the value below with your own Mapbox public token.
      mapboxgl.accessToken = "pk.eyJ1IjoiOGtydHUiLCJhIjoiY21nNGwyeXU3MHlwazJsczlmdzd0enh6aSJ9._CeKfqbZjCiOOZbNtgfQ_g";

      const map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/standard",
        projection: "globe",
        zoom: 1,
        center: [30, 15],
      });

      map.addControl(new mapboxgl.NavigationControl());
      map.scrollZoom.disable();

      map.on("error", (e) => {
        console.error("Mapbox error:", e?.error ?? e);
      });

      map.on("style.load", () => {
        map.setFog({});
      });
    </script>
  </body>
</html>
